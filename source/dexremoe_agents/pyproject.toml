[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dexremoe-agents"
version = "0.1.0"
description = "DexReMoE training-side networks (PointNet, mu_e, ActorCritic)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["dexremoe_agents*"]
